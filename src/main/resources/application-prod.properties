# Production profile — activated with SPRING_PROFILES_ACTIVE=prod
# All values come from environment variables so no secrets live in the image.

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventorydb}
spring.datasource.username=${DB_USERNAME:inventory}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — default to validate so prod never auto-mutates the schema.
# Override DDL_AUTO=update for a throwaway demo DB that has no schema yet.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable the H2 web console in production
spring.h2.console.enabled=false

server.port=${SERVER_PORT:8080}
