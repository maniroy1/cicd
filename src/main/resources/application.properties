spring.application.name=inventory-management

# H2 Database (in-memory)
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Logging — write to a file so logs can be persisted to a Docker volume.
# LOG_FILE can be overridden by an env var (e.g. /app/logs/inventory.log in Docker).
logging.file.name=${LOG_FILE:logs/inventory.log}
logging.level.com.example.inventory=INFO
# Roll the log file daily / when it hits the size cap, keep 7 days of history.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# Caching — use a simple in-memory cache locally / in tests (no Redis needed).
# The prod profile overrides this to use Redis.
spring.cache.type=simple

# Reporting API. Credentials come from the environment, never from source.
# With no admin key configured the privileged report endpoints fail closed (401).
reports.directory=${REPORTS_DIR:/var/reports}
admin.api-key=${ADMIN_API_KEY:}
backup.allowed-hosts=${BACKUP_ALLOWED_HOSTS:}
backup.password=${BACKUP_PASSWORD:}
