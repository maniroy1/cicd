name: CI

# Run on pushes to main and any feature/* branch, plus manual triggers.
on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  # ---------- JOB 1: TEST (the gate) ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B clean verify

  # ---------- JOB 2: BUILD IMAGE + PUSH TO ECR (only if tests pass) ----------
  build-and-push:
    needs: test                 # waits for the test job to succeed
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: inventory-management
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- JOB 3: DEPLOY TO k3s (only if image was pushed) ----------
  deploy:
    needs: build-and-push       # waits for the image to be in ECR
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to k3s over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ec2-user/.kube/config

            # 1. refresh the ECR image-pull secret (its token expires ~12h)
            kubectl create secret docker-registry ecr-secret -n inventory \
              --docker-server=281535664028.dkr.ecr.ap-south-1.amazonaws.com \
              --docker-username=AWS \
              --docker-password="$(aws ecr get-login-password --region ap-south-1)" \
              --dry-run=client -o yaml | kubectl apply -f -

            # 2. roll out the image built for THIS commit (immutable SHA tag)
            kubectl set image deployment/inventory-app -n inventory \
              inventory-app=281535664028.dkr.ecr.ap-south-1.amazonaws.com/inventory-management:${{ github.sha }}

            # 3. wait for the rollout to finish (fails the job if it stalls)
            kubectl rollout status deployment/inventory-app -n inventory --timeout=180s
