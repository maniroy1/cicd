language: java
jdk:
  - openjdk17

# Only build the main branch and any feature/* branch on push.
branches:
  only:
    - main
    - /^feature\/.*$/

cache:
  directories:
    - $HOME/.m2

script:
  - mvn clean verify -B

# Build the runnable jar as an artifact of the build
after_success:
  - mvn package -B -DskipTests
